[project]
name = "tagsparser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "multilspy>=0.0.15",
]

[project.scripts]
lsp-callgraph = "code_viewer.lsp_callgraph_cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_viewer*"]

[tool.uv]
package = true
